<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        composeScript();
      })
  
      function composeScript () {
        return new Promise((resolve, reject) => {
          window.compose = window.compose || {}
          window.compose.customRedirect = url => {
            history.pushState({}, '', url)
          }
  
          const script = document.createElement('script')
          // script.src = 'https://compose-scripts.s3.amazonaws.com/663e896f1cc2c77e55b0695a/67587bd96f9a607772d84912.js'
          script.src = 'https://compose-scripts.s3.amazonaws.com/6761ae593a480c419301cca3/6761b0ab3a480c419301ccbf.js'
  
          script.onload = () => {
            console.log('%cCompose script loaded', 'color: #1e90ff; font-weight: bold;')
            resolve()
          }
  
          script.onerror = (err) => {
            console.log(err);
            console.log('%cCompose script failed to load', 'color: #ff0000; font-weight: bold;')
          }
  
          document.head.appendChild(script)
        })
      }
    </script>
    <title>Earth Echoes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
